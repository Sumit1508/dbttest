version: 2

models:
  - name: DWH_Package_dbtpoc
    description: "Data warehouse table containing curated package data"

    columns:
      - name: package_code
        description: "Unique code identifying the package"
        tests:
          - not_null
          - unique

      - name: pkg_price
        description: "Price of the package"
        tests:
          - dbt_utils.expression_is_true:
              expression: "pkg_price >= 0"

      - name: pkg_active
        description: "Indicates whether the package is active"
        tests:
          - accepted_values:
              values: [true, false]

      - name: allow_ala_carte
        description: "Indicates if ala carte items are allowed"
        tests:
          - accepted_values:
              values: [true, false]

      - name: yr_searched
        description: "Years of search history"
        tests:
          - not_null


